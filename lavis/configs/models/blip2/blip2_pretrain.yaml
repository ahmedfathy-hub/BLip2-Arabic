model:
  arch: pretrain
  load_finetuned: False

  pretrained: "/content/drive/MyDrive/Ahmed/Shared_with_Dr_Hatem/Checkpth_5_epoch/Pretrain_stage1/pretrain_(5)epochs_stage(1)_checkpoint_1.pth"
  #finetuned: "/content/drive/MyDrive/Ahmed/Shared_with_Dr_Hatem/Checkpth_5_epoch/Pretrain_stage1/pretrain_(5)epochs_stage(1)_checkpoint_1.pth"

  # vit encoder
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp32"
  freeze_vit: True

  # Q-Former
  num_query_token: 32


preprocess:
    vis_processor:
        train:
          name: "blip_image_train"
          image_size: 224
        eval:
          name: "blip_image_eval"
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"
